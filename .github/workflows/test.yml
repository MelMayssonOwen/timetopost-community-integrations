name: Tests

on:
  push:
    branches: [main]
  pull_request:
    paths: ['engine/**', 'scripts/**', 'tests/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/*.test.ts'
      - run: node scripts/check-all.ts
